# .github/workflows/deploy.yml
# Builds the Vite app and deploys to GitHub Pages automatically
# on every push to main.
#
# ONE-TIME SETUP (in GitHub):
#   Repository → Settings → Pages → Source: "GitHub Actions"
#   Repository → Settings → Actions → General → Workflow permissions: "Read and write"

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual run from the Actions tab

# Grant write access for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ─── Job 1: Build ───────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm       # caches node_modules between runs — never commits them

      - name: Install dependencies (clean install)
        run: npm ci        # respects package-lock.json exactly; never writes node_modules to git

      - name: Build with Vite
        run: npm run build # outputs to dist/

      - name: Upload dist/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ─── Job 2: Deploy ──────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
