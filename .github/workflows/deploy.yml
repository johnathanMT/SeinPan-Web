# Builds, verifies and deploys the site to GitHub Pages on every push to main.
#
# ONE-TIME SETUP (in GitHub):
#   Settings → Pages → Source: "GitHub Actions"
#
# A push only deploys if every quality gate passes: types, lint (incl.
# accessibility rules), translation parity, tests (incl. axe-core) and a
# production dependency audit.
#
# All actions run on GitHub's Node 24 runtime (the Node 20 action runtime is
# deprecated). The runner image is pinned so an upstream `ubuntu-latest`
# switch can't change the build without a reviewed commit.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify & build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint (incl. jsx-a11y)
        run: npm run lint

      - name: Translation parity
        run: npm run check:locales

      - name: Tests (unit + axe-core accessibility)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
