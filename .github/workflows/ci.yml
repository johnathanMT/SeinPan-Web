# Verifies every push to main and every pull request: dependency audit,
# types, lint (incl. accessibility rules), translation parity, tests (incl.
# axe-core) and a production build with a check that nothing private ships.
#
# Deployment is done by Vercel, which builds each push to main itself.
#
# All actions run on GitHub's Node 24 runtime (the Node 20 action runtime is
# deprecated). The runner image is pinned so an upstream `ubuntu-latest`
# switch can't change the build without a reviewed commit, and every action is
# pinned to a full commit SHA (a moved or hijacked tag can't inject code).
# Dependabot keeps the SHAs and their version comments current.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify & build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint (incl. jsx-a11y)
        run: npm run lint

      - name: Translation parity
        run: npm run check:locales

      - name: Tests (unit + axe-core accessibility)
        run: npm test

      - name: Build
        run: npm run build

      # Nothing private may be published: OS metadata, source maps, env files.
      - name: Check build output
        run: |
          leaked=$(find dist \( -name '.DS_Store' -o -name '*.map' -o -name '.env*' \) -print)
          if [ -n "$leaked" ]; then echo "::error::Files that must not be deployed:"; echo "$leaked"; exit 1; fi
