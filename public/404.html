<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sein Pan Electronic</title>
    <!--
      SPA fallback for GitHub Pages (rafgraph/spa-github-pages technique).
      GitHub Pages serves this 404.html for any unknown path. The script
      rewrites the URL into a query the app can restore, then redirects to
      index.html. pathSegmentsToKeep = 0 because the custom domain
      (seinpanelectronic.com) is served from the site root.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
